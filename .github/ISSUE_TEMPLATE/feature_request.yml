# The first two fields exist to catch the two requests we expect most and have
# already answered: the training data / pipeline (not published, no plans) and
# a PyPI wheel (deliberately not shipped). Both are stated in README.md
# § "What is and is not in this release"; asking here saves the reporter the
# round-trip.
name: Feature request
description: Suggest a change to the server, the gates, the skill, or the docs
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Two things are settled and out of scope, so that a request for either
        gets an answer here rather than in a closed issue: the **training data
        and fine-tuning pipeline are not published** and there are no plans to
        publish them, and there is **no PyPI wheel** — the pykx licence × kdb+
        version × qlint presence × CUDA × vLLM matrix is real complexity that
        `pip install` would misrepresent. Both are explained in `README.md`.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: >-
        The situation you are in, not the change you have in mind — that comes
        next. A concrete case we can reproduce is worth more than a general
        principle.
      render: text
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see instead?
      render: text
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the project?
      options:
        - The MCP server / self-consistency pipeline
        - The gate stack (parse, qlint C9, runtime execution)
        - The /qsql-coder skill
        - The model or its prompt contract
        - Release tooling (tools/prepare_release.py)
        - Docs
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: semantics
    attributes:
      label: Is this about semantic correctness?
      description: >-
        If the request is "the server should have caught that the code was
        wrong", read "Design stance" in `mcp_server/README.md` first. Closing
        the semantic-intent gap needs an external reference computed
        independently of the draft, which the server cannot obtain — it is
        deliberately the caller's job. A proposal that supplies such a
        reference is very much in scope; one that asks for a stronger internal
        gate is probably not.
      options:
        - label: I have read that section and my proposal accounts for it
        - label: Not applicable — this is not about semantic correctness

  - type: textarea
    id: verification
    attributes:
      label: How would this be tested?
      description: >-
        Which tier would cover it — 1 (pure logic, no q), 2 (real embedded q,
        model stubbed), 3 (needs qlint), or 4 (needs a live vLLM)? Tiers 2 to 4
        need a kdb+ licence, pykx and EULA-gated AxLibraries, so a change that
        can only be verified at tier 3 or 4 is slower for us to accept. Saying
        so up front is not a reason to withhold the request.
      render: text
